<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#fff;--c:#fff;--t:#1b2433;--m:#6b7788;--p:#0a6b68;--b:#dfe3ea;--th:#f3f4f6;--hov:#e9f7f5;--hint:#fff7e8}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,"Segoe UI",Arial,sans-serif;background:#fff;color:var(--t)}
header{background:#fff;color:var(--t);padding:12px 18px;display:flex;flex-wrap:wrap;gap:14px;align-items:center;border-bottom:3px solid var(--p)}
.lg{width:42px;height:42px;border-radius:12px;background:#dff3f0;display:grid;place-items:center;font-size:22px}
.tt h1{font-size:17px;margin:0;font-weight:700;color:var(--p)}.tt small{color:var(--m);font-size:12px}
header label{font-size:12px;color:var(--m);display:flex;flex-direction:column;gap:2px}header select{font-weight:600;min-width:84px}
header .who{background:#f3f4f6;padding:5px 12px;border-radius:20px;font-size:12px}
select,button,input{font:inherit;color:var(--t);background:#fff;border:1px solid var(--b);border-radius:8px;padding:6px 11px;transition:.15s}
button{cursor:pointer}button:hover{border-color:var(--p);transform:translateY(-1px)}
button.p{background:linear-gradient(135deg,#16a393,#0a6b68);color:#fff;border:0;box-shadow:0 2px 6px rgba(10,107,104,.3)}
nav{display:flex;gap:6px;padding:12px 18px 4px;flex-wrap:wrap}nav button{border-radius:22px;padding:8px 18px;font-weight:600;background:#f3f4f6;border:0}
nav button.on{background:linear-gradient(135deg,#16a393,#0a6b68);color:#fff}
main{padding:6px 18px 36px}.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0;align-items:center}.m{color:var(--m)}
.bar.m{background:var(--hint);border-left:4px solid #f0a020;padding:9px 14px;border-radius:8px}
.w{overflow:auto;max-height:68vh;border:1px solid var(--b);background:#fff;border-radius:12px}
table{border-collapse:separate;border-spacing:0;white-space:nowrap;width:100%}
th,td{border-right:1px solid var(--b);border-bottom:1px solid var(--b);padding:0 8px;height:30px;font-size:13px;background:#fff}
th{background:var(--th);position:sticky;top:0;z-index:2;font-weight:700;color:#333;text-align:center}tr.h2 th{top:30px}
#gr tr:nth-child(even) td{background:#fafafa}#gr tr:hover td{background:var(--hov)}#rk tr:hover td{filter:brightness(.95)}
td[contenteditable]{min-width:76px;outline:none;cursor:cell}td[contenteditable]:focus{outline:2px solid var(--p);outline-offset:-2px;background:var(--hov)}
