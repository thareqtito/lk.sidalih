function forceLogout(m){PM=null;SESS="";USER="";sessionStorage.removeItem("ses");sessionStorage.removeItem("usr");clearTimeout(idleT);
 SYNC.forEach(k=>{if(DB.q[k]){DB.q[k].rows=[];DB.q[k].h=undefined}});Object.keys(LD).forEach(k=>delete LD[k]);save();$("#mn").innerHTML="";lgShow(m)}
function enter(){document.body.classList.remove("nl");$("#lg").classList.remove("on");$("#who").textContent="👤 "+USER;resetIdle();render()}
async function doLogin(){const c=cfg(),u=$("#lurl").value.trim();if(u)c.url=u;if(!c.url)return $("#lm").textContent="Isi URL Web App terlebih dahulu.";
 $("#lm").textContent="⏳ Memeriksa…";try{const d=await api({a:"login",u:$("#lu").value,p:$("#lp").value});if(!d.ok)throw new Error(d.err);
  SESS=d.s;USER=d.u;sessionStorage.setItem("ses",SESS);sessionStorage.setItem("usr",USER);$("#lp").value="";save();enter()}catch(x){$("#lm").textContent="❌ "+(x.message||x)}}
$("#lgo").onclick=doLogin;$("#lp").onkeydown=e=>{if(e.key=="Enter")doLogin()};
$("#lo").onclick=()=>{api({a:"out"}).catch(()=>{});forceLogout("Anda sudah keluar.")};
$("#pw").onclick=()=>{["p0","p1","p2"].forEach(i=>$("#"+i).value="");$("#pm").textContent="";$("#pwd").classList.add("on")};
$("#pcl").onclick=()=>$("#pwd").classList.remove("on");
$("#psv").onclick=async()=>{if($("#p1").value!==$("#p2").value)return $("#pm").textContent="❌ Password baru dan ulangannya tidak sama.";
 try{const d=await api({a:"pw",o:$("#p0").value,n:$("#p1").value});if(!d.ok)throw new Error(d.err);$("#pwd").classList.remove("on");alert("Password berhasil diubah.");log("Ubah","Password pengguna diganti")}catch(x){$("#pm").textContent="❌ "+(x.message||x)}};
function boot(){if(SESS&&cfg().url)api({a:"me"}).then(d=>{if(d.ok){USER=d.u;enter()}else lgShow("")}).catch(()=>{if(SESS)lgShow("Tidak bisa terhubung. Periksa internet, lalu muat ulang.")});else lgShow("")}
function setTop(){const t=document.getElementById("top");document.documentElement.style.setProperty("--top",(t?t.offsetHeight:0)+"px")}
addEventListener("resize",setTop);
boot();
</script></body></html>
